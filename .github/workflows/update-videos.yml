name: Auto-Update YouTube Videos

on:
  schedule:
    # Run every day at 00:00 UTC and 18:00 UTC (after Wednesday & Sunday uploads)
    - cron: '0 0,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Latest YouTube Uploads
        run: |
          python3 scripts/sync_youtube.py

      - name: Commit and Push if New Videos Found
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all_videos.json
          if git diff --staged --quiet; then
            echo "No new videos to commit."
          else
            git commit -m "Auto-update YouTube video archive [skip ci]"
            git push origin main
          fi
